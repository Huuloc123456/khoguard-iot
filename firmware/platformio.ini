; Sources and rationale: README.md. Secret/build artifacts stay under protected .local.
[platformio]
build_dir = ../.local/firmware-build

[env:esp32dev]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
; include/ is added for lib/khoguard, which PlatformIO compiles without the project include path.
build_flags = -Iinclude -I../.local/firmware
lib_deps =
  256dpi/MQTT@2.5.3
  bblanchon/ArduinoJson@7.4.3
  adafruit/DHT sensor library@1.4.7
  adafruit/Adafruit Unified Sensor@1.1.15
