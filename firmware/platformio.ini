; Sources and rationale: README.md. Secret/build artifacts stay under protected .local.
[platformio]
build_dir = ../.local/firmware-build

; Shared by every image: ESP-C01 (esp32dev) and the zone nodes for zones A/B/D (DEC-043).
[env]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  256dpi/MQTT@2.5.3
  bblanchon/ArduinoJson@7.4.3
  adafruit/DHT sensor library@1.4.7
  adafruit/Adafruit Unified Sensor@1.1.15

[env:esp32dev]
; include/ is added for lib/khoguard, which PlatformIO compiles without the project include path.
build_flags = -Iinclude -I../.local/firmware
build_src_filter = +<*> -<zone_main.cpp>

; Each zone node reads its own kg_secrets.h (only that device's MQTT account) from .local/firmware/<env>.
[env:zone_a]
build_flags = -Iinclude -I../.local/firmware/zone_a -DKG_ZONE_A
build_src_filter = +<zone_main.cpp>

[env:zone_b]
build_flags = -Iinclude -I../.local/firmware/zone_b -DKG_ZONE_B
build_src_filter = +<zone_main.cpp>

[env:zone_d]
build_flags = -Iinclude -I../.local/firmware/zone_d -DKG_ZONE_D
build_src_filter = +<zone_main.cpp>
