<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820" role="img"><title>Kiến trúc KhoGuard một khu</title><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif"><text x="60" y="64" font-size="34" fill="#20313c" text-anchor="start"><tspan x="60" dy="0">KIẾN TRÚC KHOGUARD MỘT KHU C</tspan></text><rect x="60" y="160" width="350" height="215" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="82" y="200" font-size="26" fill="#20313c" text-anchor="start"><tspan x="82" dy="0">ĐẦU VÀO</tspan><tspan x="82" dy="36.4">DHT22, PIR, MFRC522</tspan><tspan x="82" dy="36.4">2 contact, 2 Panic</tspan><tspan x="82" dy="36.4">2 HC-SR04</tspan></text><rect x="510" y="160" width="350" height="215" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="532" y="200" font-size="26" fill="#20313c" text-anchor="start"><tspan x="532" dy="0">ESP-C01 / WOKWI</tspan><tspan x="532" dy="36.4">Liên động D07–D08</tspan><tspan x="532" dy="36.4">Xử lý tại chỗ, timer</tspan><tspan x="532" dy="36.4">Servo, relay, LED, còi</tspan></text><rect x="960" y="160" width="320" height="215" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="982" y="200" font-size="26" fill="#20313c" text-anchor="start"><tspan x="982" dy="0">MOSQUITTO</tspan><tspan x="982" dy="36.4">MQTT/TLS 18885</tspan><tspan x="982" dy="36.4">ACL: 3 account</tspan><tspan x="982" dy="36.4">QoS1, CA + hostname</tspan></text><rect x="1380" y="160" width="350" height="215" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="1402" y="200" font-size="26" fill="#20313c" text-anchor="start"><tspan x="1402" dy="0">BACKEND NODE.JS</tspan><tspan x="1402" dy="36.4">Kiểm tra dữ liệu/phiên</tspan><tspan x="1402" dy="36.4">REST + WebSocket</tspan><tspan x="1402" dy="36.4">MySQL lưu lịch sử</tspan></text><rect x="1380" y="480" width="350" height="170" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="1402" y="520" font-size="26" fill="#20313c" text-anchor="start"><tspan x="1402" dy="0">REACT KHOGUARD</tspan><tspan x="1402" dy="36.4">Điều hành khu C</tspan><tspan x="1402" dy="36.4">Yêu cầu lệnh + ACK</tspan></text><rect x="960" y="480" width="320" height="170" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="982" y="520" font-size="26" fill="#20313c" text-anchor="start"><tspan x="982" dy="0">BRIDGE VIEWER</tspan><tspan x="982" dy="36.4">Snapshot mỗi 10 s</tspan><tspan x="982" dy="36.4">MQTT/TLS lên Cloud</tspan></text><rect x="510" y="480" width="350" height="170" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="532" y="520" font-size="26" fill="#20313c" text-anchor="start"><tspan x="532" dy="0">THINGSBOARD CLOUD</tspan><tspan x="532" dy="36.4">1 bảng khu C</tspan><tspan x="532" dy="36.4">2 biểu đồ môi trường</tspan></text><path d="M410 265 L510 265" stroke="#287467" stroke-width="3" fill="none"/><path d="M860 265 L960 265" stroke="#287467" stroke-width="3" fill="none"/><path d="M1280 265 L1380 265" stroke="#287467" stroke-width="3" fill="none"/><path d="M1555 375 L1555 480" stroke="#287467" stroke-width="3" fill="none"/><path d="M1380 330 L1340 330" stroke="#287467" stroke-width="3" fill="none"/><path d="M1340 330 L1340 565" stroke="#287467" stroke-width="3" fill="none"/><path d="M1340 565 L1280 565" stroke="#287467" stroke-width="3" fill="none"/><path d="M960 565 L860 565" stroke="#287467" stroke-width="3" fill="none"/><text x="60" y="740" font-size="25" fill="#20313c" text-anchor="start"><tspan x="60" dy="0">Quan trắc: ESP32 tới backend, React và Cloud. Lệnh: React qua backend về ESP32, thiết bị tự quyết định.</tspan><tspan x="60" dy="35">MySQL giữ lịch sử bản nhiều khu. Mọi màn hình và nghiệp vụ hiện hành chỉ chọn khu C.</tspan></text></g></svg>