-width="2"/><text x="78" y="369" font-size="25" fill="#20313c" text-anchor="start"><tspan x="78" dy="0">CONTACT D08 chân 2</tspan></text><text x="78" y="401" font-size="20" fill="#20313c" text-anchor="start"><tspan x="78" dy="0">HIGH mở · LOW đóng</tspan></text><path d="M620 380 L850 380" stroke="#287467" stroke-width="3" fill="none"/><text x="835" y="371" font-size="22" fill="#176052" text-anchor="end"><tspan x="835" dy="0">GPIO19</tspan></text><rect x="60" y="440" width="560" height="85" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="78" y="469" font-size="25" fill="#20313c" text-anchor="start"><tspan x="78" dy="0">HC-SR04 D07 ECHO</tspan></text><text x="78" y="501" font-size="20" fill="#20313c" text-anchor="start"><tspan x="78" dy="0">&lt;100 cm hoặc mất echo &gt;250 ms = chắn</tspan></text><path d="M620 480 L850 480" stroke="#287467" stroke-width="3" fill="none"/><text x="835" y="471" font-size="22" fill="#176052" text-anchor="end"><tspan x="835" dy="0">GPIO17 / TX2</tspan></text><rect x="60" y="540" width="560" height="85" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="78" y="569" font-size="25" fill="#20313c" text-anchor="start"><tspan x="78" dy="0">HC-SR04 D08 ECHO</tspan></text><text x="78" y="601" font-size="20" fill="#20313c" text-anchor="start"><tspan x="78" dy="0">VCC VIN 5 V · GND chung</tspan></text><path d="M620 580 L850 580" stroke="#287467" stroke-width="3" fill="none"/><text x="835" y="571" font-size="22" fill="#176052" text-anchor="end"><tspan x="835" dy="0">GPIO21</tspan></text><rect x="60" y="640" width="560" height="85" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="78" y="669" font-size="25" fill="#20313c" text-anchor="start"><tspan x="78" dy="0">HC-SR04 D07 + D08 TRIG</tspan></text><text x="78" y="701" font-size="20" fill="#20313c" text-anchor="start"><tspan x="78" dy="0">Chung xung 10 µs mỗi 60 ms</tspan></text><path d="M620 680 L850 680" stroke="#287467" stroke-width="3" fill="none"/>