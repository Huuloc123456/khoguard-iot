 font-size="20" fill="#20313c" text-anchor="start"><tspan x="78" dy="0">3.3V + RST lên 3V3 · GND chung</tspan></text><path d="M620 1080 L850 1080" stroke="#287467" stroke-width="3" fill="none"/><text x="835" y="1071" font-size="19" fill="#176052" text-anchor="end"><tspan x="835" dy="0">2 SCK / 13 MOSI</tspan><tspan x="835" dy="26.599999999999998">34 MISO / 12 CS</tspan></text><rect x="60" y="1140" width="560" height="85" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="78" y="1169" font-size="25" fill="#20313c" text-anchor="start"><tspan x="78" dy="0">RFID DIRECTION chân 2</tspan></text><text x="78" y="1201" font-size="20" fill="#20313c" text-anchor="start"><tspan x="78" dy="0">1 GND · 3 3V3 · HIGH IN / LOW OUT</tspan></text><path d="M620 1180 L850 1180" stroke="#287467" stroke-width="3" fill="none"/><text x="835" y="1171" font-size="22" fill="#176052" text-anchor="end"><tspan x="835" dy="0">GPIO35</tspan></text><rect x="1480" y="140" width="560" height="132" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="1498" y="174" font-size="25" fill="#20313c" text-anchor="start"><tspan x="1498" dy="0">RELAY KHÓA D07 IN</tspan></text><text x="1498" y="212" font-size="22" fill="#20313c" text-anchor="start"><tspan x="1498" dy="0">VCC VIN · GND · COM 3V3</tspan><tspan x="1498" dy="30.799999999999997">NO → 220 Ω → LED xanh → GND</tspan></text><path d="M1250 200 L1480 200" stroke="#287467" stroke-width="3" fill="none"/><text x="1265" y="187" font-size="22" fill="#176052" text-anchor="start"><tspan x="1265" dy="0">GPIO25</tspan></text><rect x="1480" y="297" width="560" height="132" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="1498" y="331" font-size="25" fill="#20313c" text-anchor="start"><tspan x="1498" dy="0">RELAY KHÓA D08 IN</tspan></text><text x="1498" y="369" font-size="22" fill="#20313c" text-anchor="start"><tspan x="1498" dy="0">VCC VIN · GND · COM 3V3</tspan><tspan x="1498" dy="30.799999999999997">NO → 220 Ω → LED xanh → GND</tspan></text><path d="M1250 357 L1480 357" stroke="#287467" stroke-width="3" fill="none"/><text x="1265" y="344" font-size="22" fill="#176052" text-anchor="start"><tspan x="1265" dy="0">GPIO26</tspan></text><rect x="1480" y="454" width="560" height="132" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="1498" y="488" font-size="25" fill="#20313c" text-anchor="start"><tspan x="1498" dy="0">SERVO D07 PWM</tspan></text><text x="1498" y="526" font-size="22" fill="#20313c" text-anchor="start"><tspan x="1498" dy="0">V+ VIN 5 V · GND chung</tspan><tspan x="1498" dy="30.799999999999997">0° đóng · 90° mở</tspan></text><path d="M1250 514 L1480 514" stroke="#287467" stroke-width="3" fill="none"/><text x="1265" y="501" font-size="22" fill="#176052" text-anchor="start"><tspan x="1265" dy="0">GPIO27</tspan></text><rect x="1480" y="611" width="560" height="132" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="1498" y="645" font-size="25" fill="#20313c" text-anchor="start"><tspan x="1498" dy="0">SERVO D08 PWM</tspan></text><text x="1498" y="683" font-size="22" fill="#20313c" text-anchor="start"><tspan x="1498" dy="0">Contact xác nhận vị trí độc lập</tspan><tspan x="1498" dy="30.799999999999997">Tự gạt contact sau khi servo quay</tspan></text><path d="M1250 671 L1480 671" stroke="#287467" stroke-width="3" fill="none"/><text x="1265" y="658" font-size="22" fill="#176052" text-anchor="start"><tspan x="1265" dy="0">GPIO14</tspan></text><rect x="1480" y="768" width="560" height="132" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="1498" y="802" font-size="25" fill="#20313c" text-anchor="start"><tspan x="1498" dy="0">LED ĐÈN TRẮNG</tspan></text><text x="1498" y="840" font-size="22" fill="#20313c" text-anchor="start"><tspan x="1498" dy="0">GPIO → 220 Ω → anode LED</tspan><tspan x="1498" dy="30.799999999999997">Cathode về GND</tspan></text><path d="M1250 828 L1480 828" stroke="#287467" stroke-width="3" fill="none"/><text x="1265" y="815" font-size="22" fill="#176052" text-anchor="start"><tspan x="1265" dy="0">GPIO32</tspan></text><rect x="1480" y="925" width="560" height="132" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="1498" y="959" font-size="25" fill="#20313c" text-anchor="start"><tspan x="1498" dy="0">BUZZER chân 2</tspan></text><text x="1498" y="997" font-size="22" fill="#20313c" text-anchor="start"><tspan x="1498" dy="0">Chân 1 về GND</tspan><tspan x="1498" dy="30.799999999999997">Tone 2 kHz, LEDC riêng servo</tspan></text><path d="M1250 985 L1480 985" stroke="#287467" stroke-width="3" fill="none"/><text x="1265" y="972" font-size="22" fill="#176052" text-anchor="start"><tspan x="1265" dy="0">GPIO33</tspan></text><rect x="1480" y="1082" width="560" height="132" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="1498" y="1116" font-size="25" fill="#20313c" text-anchor="start"><tspan x="1498" dy="0">RELAY SƯỞI / QUẠT IN</tspan></text><text x="1498" y="1154" font-size="22" fill="#20313c" text-anchor="start"><tspan x="1498" dy="0">COM 3V3 · NO → 220 Ω → LED sưởi</tspan><tspan x="1498" dy="30.799999999999997">NC → 220 Ω → LED quạt · GND chung</tspan></text><path d="M1250 1142 L1480 1142" stroke="#287467" stroke-width="3" fill="none"/><text x="1265" y="1129" font-size="22" fill="#176052" text-anchor="start"><tspan x="1265" dy="0">GPIO4</tspan></text><text x="60" y="1320" font-size="24" fill="#20313c" text-anchor="start"><tspan x="60" dy="0">NGUỒN: 3V3 cho MFRC522/DHT22 và mức logic · VIN 5 V cho servo/sonar/PIR/relay · Tất cả GND chung</tspan></text><text x="60" y="1368" font-size="24" fill="#9b351c" text-anchor="start"><tspan x="60" dy="0">LƯU Ý: ECHO nối trực tiếp chỉ trong Wokwi. Mạch thật cần hạ mức 5 V xuống 3,3 V và nguồn tải riêng.</tspan></text><text x="60" y="1410" font-size="23" fill="#9b351c" text-anchor="start"><tspan x="60" dy="0">PIR không đo hiện diện tĩnh. HC-SR04 không phải rèm quang an toàn. GPIO2/5/12/15 cần xét strapping trên bo thật.</tspan></text></g></svg>