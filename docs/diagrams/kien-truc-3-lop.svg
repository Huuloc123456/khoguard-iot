<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="990" viewBox="0 0 1800 990" role="img"><title>Kiến trúc 3 lớp phân hệ an toàn kho lạnh</title><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif"><text x="60" y="64" font-size="32" fill="#20313c" text-anchor="start"><tspan x="60" dy="0">KIẾN TRÚC 3 LỚP · PHÂN HỆ AN TOÀN KHO LẠNH (KHỚP MÔ PHỎNG WOKWI)</tspan></text><text x="60" y="120" font-size="24" fill="#287467" text-anchor="start"><tspan x="60" dy="0">TẦNG 1 · EDGE</tspan></text><text x="60" y="380" font-size="24" fill="#287467" text-anchor="start"><tspan x="60" dy="0">TẦNG 2 · CỤC BỘ</tspan></text><text x="60" y="640" font-size="24" fill="#287467" text-anchor="start"><tspan x="60" dy="0">TẦNG 3 · MÁY CHỦ</tspan></text><rect x="60" y="140" width="560" height="170" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="82" y="182" font-size="25" fill="#20313c" text-anchor="start"><tspan x="82" dy="0">NÚT PANIC D07 / D08</tspan><tspan x="82" dy="35">Dây cứng tới safety relay</tspan><tspan x="82" dy="35">và GPIO18 / GPIO22</tspan></text><rect x="820" y="140" width="760" height="170" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="842" y="182" font-size="25" fill="#20313c" text-anchor="start"><tspan x="842" dy="0">CẢM BIẾN → GPIO ESP32</tspan><tspan x="842" dy="35">DHT22 · PIR (thay mmWave) · MQ-2 (thay CO₂)</tspan><tspan x="842" dy="35">HC-SR04 (thay rèm quang) · contact · RFID-RC522</tspan></text><rect x="60" y="400" width="560" height="170" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="82" y="442" font-size="25" fill="#20313c" text-anchor="start"><tspan x="82" dy="0">SAFETY RELAY ×2</tspan><tspan x="82" dy="35">Panic cắt nguồn relay khóa</tspan><tspan x="82" dy="35">không cần firmware hay mạng</tspan></text><rect x="820" y="400" width="760" height="170" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="842" y="442" font-size="25" fill="#20313c" text-anchor="start"><tspan x="842" dy="0">ESP32 ESP-C01 (WiFi Wokwi)</tspan><tspan x="842" dy="35">Liên động đóng cửa, Panic, mắc kẹt: tại chỗ</tspan><tspan x="842" dy="35">JSON qua MQTT/TLS · nhận lệnh, trả ACK</tspan></text><rect x="60" y="660" width="380" height="150" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="82" y="702" font-size="25" fill="#20313c" text-anchor="start"><tspan x="82" dy="0">MOSQUITTO RIÊNG</tspan><tspan x="82" dy="35">TLS 18885</tspan><tspan x="82" dy="35">ACL 3 tài khoản</tspan></text><rect x="500" y="660" width="380" height="150" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="522" y="702" font-size="25" fill="#20313c" text-anchor="start"><tspan x="522" dy="0">BACKEND + MYSQL</tspan><tspan x="522" dy="35">Kiểm tra, lưu log</tspan><tspan x="522" dy="35">lịch ca demo</tspan></text><rect x="940" y="660" width="340" height="150" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="962" y="702" font-size="25" fill="#20313c" text-anchor="start"><tspan x="962" dy="0">REACT</tspan><tspan x="962" dy="35">Giám sát, cảnh báo</tspan><tspan x="962" dy="35">yêu cầu lệnh + ACK</tspan></text><rect x="1340" y="660" width="400" height="150" rx="8" fill="#ffffff" stroke="#b5c4ce" stroke-width="2"/><text x="1362" y="702" font-size="25" fill="#20313c" text-anchor="start"><tspan x="1362" dy="0">THINGSBOARD CLOUD</tspan><tspan x="1362" dy="35">Bản sao qua bridge</tspan><tspan x="1362" dy="35">chỉ xem</tspan></text><path d="M340 310 L340 400" stroke="#287467" stroke-width="3" fill="none"/><path d="M1200 310 L1200 400" stroke="#287467" stroke-width="3" fill="none"/><path d="M620 225 L820 225" stroke="#287467" stroke-width="3" fill="none"/><path d="M620 485 L820 485" stroke="#287467" stroke-width="3" fill="none"/><path d="M1200 570 L1200 610" stroke="#287467" stroke-width="3" fill="none"/><path d="M400 610 L1200 610" stroke="#287467" stroke-width="3" fill="none"/><path d="M400 610 L400 660" stroke="#287467" stroke-width="3" fill="none"/><path d="M440 735 L500 735" stroke="#287467" stroke-width="3" fill="none"/><path d="M880 735 L940 735" stroke="#287467" stroke-width="3" fill="none"/><path d="M690 810 L690 850" stroke="#287467" stroke-width="3" fill="none"/><path d="M690 850 L1540 850" stroke="#287467" stroke-width="3" fill="none"/><path d="M1540 850 L1540 810" stroke="#287467" stroke-width="3" fill="none"/><text x="640" y="215" font-size="20" fill="#176052" text-anchor="start"><tspan x="640" dy="0">GPIO</tspan></text><text x="640" y="475" font-size="20" fill="#176052" text-anchor="start"><tspan x="640" dy="0">cắt nguồn khóa</tspan></text><text x="1215" y="598" font-size="20" fill="#176052" text-anchor="start"><tspan x="1215" dy="0">MQTT/TLS</tspan></text><text x="60" y="910" font-size="23" fill="#20313c" text-anchor="start"><tspan x="60" dy="0">Mạng, MQTT và dashboard chỉ giám sát, ghi log, cảnh báo và gửi yêu cầu lệnh. Mất mạng: ESP32 và safety relay vẫn xử lý tại chỗ.</tspan><tspan x="60" dy="32.199999999999996">VLAN của bản thực tế được thay bằng tài khoản + ACL topic riêng trên broker. Camera nhiệt, radar mmWave, LoRaWAN chỉ là hướng nâng cấp.</tspan></text></g></svg>