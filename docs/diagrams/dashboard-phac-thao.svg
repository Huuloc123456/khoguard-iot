<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Phác thảo dashboard KhoGuard khu C</title>
  <desc id="desc">Bản phác thảo dựa trên các màn hình và thành phần hiện có trong ứng dụng KhoGuard. Các số liệu để trống, không phải ảnh chụp dữ liệu thật.</desc>
  <rect width="1440" height="960" fill="#f5f8f8"/>
  <rect x="0" y="0" width="216" height="960" fill="#ffffff"/>
  <rect x="0" y="0" width="216" height="960" fill="none" stroke="#dce5e5"/>
  <rect x="24" y="24" width="42" height="42" rx="10" fill="#176b5b"/>
  <text x="45" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">K</text>
  <text x="78" y="45" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#24343b">KhoGuard</text>
  <text x="78" y="63" font-family="Arial,sans-serif" font-size="11" fill="#76878c">Quản lý kho thông minh</text>
  <g font-family="Arial,sans-serif" font-size="15" fill="#33464d">
    <rect x="14" y="112" width="188" height="44" rx="8" fill="#e8f4f1"/><text x="32" y="140" fill="#176b5b" font-weight="700">▦  Tổng quan</text>
    <text x="32" y="196">▤  Sơ đồ kho</text><text x="32" y="250">▣  Giám sát cửa</text>
    <text x="32" y="304">♧  Môi trường</text><text x="32" y="358">▣  Nhận hàng</text><text x="32" y="412">◷  Nhật ký</text>
  </g>
  <text x="250" y="39" font-family="Arial,sans-serif" font-size="13" fill="#718188">Kho lạnh · Khu C</text>
  <text x="250" y="90" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#24343b">Tổng quan kho hàng</text>
  <text x="250" y="119" font-family="Arial,sans-serif" font-size="15" fill="#718188">Theo dõi môi trường, hai cửa liên động và cảnh báo.</text>
  <rect x="1124" y="31" width="266" height="42" rx="7" fill="#ffffff" stroke="#d9e3e4"/>
  <text x="1142" y="57" font-family="Arial,sans-serif" font-size="13" fill="#53666d">Nguồn dữ liệu: Backend / MQTT  ▾</text>
