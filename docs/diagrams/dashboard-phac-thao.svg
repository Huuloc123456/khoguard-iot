  <rect x="326" y="597" width="238" height="38" rx="6" fill="#ffffff" stroke="#d4e1de"/><text x="344" y="621" font-family="Arial,sans-serif" font-size="13" fill="#53666d">D07 · Chưa rõ</text>
  <rect x="581" y="597" width="238" height="38" rx="6" fill="#ffffff" stroke="#d4e1de"/><text x="599" y="621" font-family="Arial,sans-serif" font-size="13" fill="#53666d">D08 · Chưa rõ</text>
