  <circle cx="275" cy="178" r="5" fill="#d49a35"/>
  <text x="290" y="183" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#33464d">Trạng thái dữ liệu</text>
  <text x="275" y="207" font-family="Arial,sans-serif" font-size="13" fill="#718188">Chưa có dữ liệu mới · trạng thái phải được xác nhận từ thiết bị</text>
  <g font-family="Arial,sans-serif">
    <rect x="250" y="250" width="270" height="110" rx="9" fill="#ffffff" stroke="#dce5e5"/><text x="272" y="281" font-size="14" fill="#718188">Cửa giám sát</text><text x="272" y="329" font-size="30" font-weight="700" fill="#24343b">— <tspan font-size="14" font-weight="400">/ 2 cửa</tspan></text><text x="272" y="347" font-size="12" fill="#718188">D07 · D08</text>
    <rect x="540" y="250" width="270" height="110" rx="9" fill="#ffffff" stroke="#dce5e5"/><text x="562" y="281" font-size="14" fill="#718188">Người trong kho</text><text x="562" y="329" font-size="30" font-weight="700" fill="#24343b">— <tspan font-size="14" font-weight="400">người</tspan></text><text x="562" y="347" font-size="12" fill="#718188">Chưa xác minh nếu thiếu dữ liệu</text>
    <rect x="830" y="250" width="270" height="110" rx="9" fill="#ffffff" stroke="#dce5e5"/><text x="852" y="281" font-size="14" fill="#718188">Nhiệt độ · Độ ẩm</text><text x="852" y="329" font-size="25" font-weight="700" fill="#24343b">— °C  ·  — %</text><text x="852" y="347" font-size="12" fill="#718188">DHT22 · dữ liệu mới nhất</text>
    <rect x="1120" y="250" width="270" height="110" rx="9" fill="#ffffff" stroke="#dce5e5"/><text x="1142" y="281" font-size="14" fill="#718188">Cảnh báo cần theo dõi</text><text x="1142" y="329" font-size="30" font-weight="700" fill="#24343b">— <tspan font-size="14" font-weight="400">cảnh báo</tspan></text><text x="1142" y="347" font-size="12" fill="#718188">Lấy từ trạng thái hệ thống</text>
  </g>
  <rect x="250" y="380" width="710" height="330" rx="9" fill="#ffffff" stroke="#dce5e5"/>
  <text x="276" y="416" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#24343b">Sơ đồ kho · Khu C</text>
  <text x="276" y="441" font-family="Arial,sans-serif" font-size="13" fill="#718188">Một khu lạnh · hai cửa được giám sát</text>
