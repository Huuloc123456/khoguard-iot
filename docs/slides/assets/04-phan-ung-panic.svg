<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Panic được xử lý tại ESP32"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#4d8176"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="70" y="85" fill="#183e36" font-size="43" font-weight="700">Panic được xử lý tại ESP32</text><text x="70" y="132" fill="#647780" font-size="24" font-weight="400">Không phụ thuộc vào kết nối broker hoặc dashboard</text><rect x="510" y="190" width="580" height="140" rx="18" fill="#fff1e9" stroke="#cbdad5"/><text x="535" y="234" fill="#146c5b" font-size="29" font-weight="650">Nhấn nút Panic</text><text x="535" y="281" fill="#263b42" font-size="24" font-weight="400">Chốt trạng thái khẩn cấp tại thiết bị</text><path d="M 800 332 L 800 395" stroke="#4d8176" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="100" y="400" width="1400" height="130" rx="18" fill="#fff1e9" stroke="#cbdad5"/><text x="125" y="444" fill="#146c5b" font-size="29" font-weight="650">Ưu tiên khẩn cấp</text><text x="125" y="491" fill="#263b42" font-size="24" font-weight="400">Nhả khóa · yêu cầu mở cửa · chặn đóng lại khi panic còn chốt</text><path d="M 300 532 L 300 605" stroke="#4d8176" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M 800 532 L 800 605" stroke="#4d8176" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M 1300 532 L 1300 605" stroke="#4d8176" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="100" y="610" width="400" height="135" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="125" y="654" fill="#146c5b" font-size="29" font-weight="650">Đèn và còi</text><text x="125" y="701" fill="#263b42" font-size="24" font-weight="400">Báo động tại chỗ</text><rect x="600" y="610" width="400" height="135" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="625" y="654" fill="#146c5b" font-size="29" font-weight="650">Sưởi / quạt</text><text x="625" y="701" fill="#263b42" font-size="24" font-weight="400">Đầu ra mô phỏng</text><rect x="1100" y="610" width="400" height="135" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="1125" y="654" fill="#146c5b" font-size="29" font-weight="650">Ghi sự kiện</text><text x="1125" y="701" fill="#263b42" font-size="24" font-weight="400">Gửi lại khi nối mạng</text><path d="M70 800 H1530" stroke="#dce5e1"/><text x="70" y="845" fill="#647780" font-size="22" font-weight="400">LED biểu diễn đầu ra; mô hình không thay thế relay an toàn hoặc cơ cấu thoát hiểm cơ học.</text></g></svg>