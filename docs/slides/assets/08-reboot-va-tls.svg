<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Hai tình huống phải từ chối vận hành"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#4d8176"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="70" y="85" fill="#183e36" font-size="43" font-weight="700">Hai tình huống phải từ chối vận hành</text><text x="70" y="132" fill="#647780" font-size="24" font-weight="400">Kiểm tra trực tiếp trên ESP32 chạy trong Wokwi</text><rect x="100" y="220" width="650" height="350" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="125" y="264" fill="#146c5b" font-size="29" font-weight="650">Khởi động lại khi có người</text><text x="125" y="311" fill="#263b42" font-size="24" font-weight="400">Trước reboot: count 1, đã xác minh</text><text x="125" y="349" fill="#263b42" font-size="24" font-weight="400">ESP.restart() → boot ID đổi</text><text x="125" y="387" fill="#263b42" font-size="24" font-weight="400">Sau reboot: count null, chưa xác minh</text><text x="125" y="425" fill="#263b42" font-size="24" font-weight="400">Có hiện diện → từ chối đóng cửa</text><rect x="850" y="220" width="650" height="350" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="875" y="264" fill="#146c5b" font-size="29" font-weight="650">Chứng chỉ không hợp lệ</text><text x="875" y="311" fill="#263b42" font-size="24" font-weight="400">CA sai hoặc hostname sai</text><text x="875" y="349" fill="#263b42" font-size="24" font-weight="400">ESP32 báo lỗi xác minh X.509</text><text x="875" y="387" fill="#263b42" font-size="24" font-weight="400">Không có MQTT_ONLINE / telemetry</text><text x="875" y="425" fill="#263b42" font-size="24" font-weight="400">CA đúng → kết nối lại thành công</text><text x="170" y="700" fill="#146c5b" font-size="30" font-weight="650">Kết thúc kiểm thử: phục hồi firmware bình thường · 5/5 thiết bị online và fresh</text><path d="M70 800 H1530" stroke="#dce5e1"/><text x="70" y="845" fill="#647780" font-size="22" font-weight="400">Bản firmware kiểm thử riêng; controller.h giữ nguyên; log và kết quả được lưu trong docs/evidence.</text></g></svg>