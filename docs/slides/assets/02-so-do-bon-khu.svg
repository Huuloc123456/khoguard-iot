<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Mô hình toàn kho: 4 khu, 12 cửa"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#4d8176"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="70" y="85" fill="#183e36" font-size="43" font-weight="700">Mô hình toàn kho: 4 khu, 12 cửa</text><text x="70" y="132" fill="#647780" font-size="24" font-weight="400">5 danh tính thiết bị · Kho lạnh C là trọng tâm kiểm thử an toàn</text><rect x="100" y="195" width="670" height="245" rx="18" fill="#f4f7f8" stroke="#cbdad5"/><text x="125" y="239" fill="#146c5b" font-size="29" font-weight="650">Khu A · Kho thường</text><text x="125" y="286" fill="#263b42" font-size="24" font-weight="400">18 đến 30 °C</text><text x="125" y="324" fill="#263b42" font-size="24" font-weight="400">D01 · D02 · D03</text><text x="125" y="362" fill="#263b42" font-size="24" font-weight="400">Nguồn: SIM-A01</text><rect x="830" y="195" width="670" height="245" rx="18" fill="#f4f7f8" stroke="#cbdad5"/><text x="855" y="239" fill="#146c5b" font-size="29" font-weight="650">Khu B · Kho mát</text><text x="855" y="286" fill="#263b42" font-size="24" font-weight="400">2 đến 8 °C</text><text x="855" y="324" fill="#263b42" font-size="24" font-weight="400">D04 · D05 · D06</text><text x="855" y="362" fill="#263b42" font-size="24" font-weight="400">Nguồn: SIM-B01</text><rect x="100" y="485" width="670" height="245" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="125" y="529" fill="#146c5b" font-size="29" font-weight="650">Khu C · Kho lạnh</text><text x="125" y="576" fill="#263b42" font-size="24" font-weight="400">−22 đến −16 °C</text><text x="125" y="614" fill="#263b42" font-size="24" font-weight="400">D07 · D08: ESP-C01 / Wokwi</text><text x="125" y="652" fill="#263b42" font-size="24" font-weight="400">D09: SIM-C02</text><rect x="830" y="485" width="670" height="245" rx="18" fill="#f4f7f8" stroke="#cbdad5"/><text x="855" y="529" fill="#146c5b" font-size="29" font-weight="650">Khu D · Khu đệm</text><text x="855" y="576" fill="#263b42" font-size="24" font-weight="400">18 đến 28 °C</text><text x="855" y="614" fill="#263b42" font-size="24" font-weight="400">D10 · D11 · D12</text><text x="855" y="652" fill="#263b42" font-size="24" font-weight="400">Nguồn: SIM-D01</text><path d="M70 800 H1530" stroke="#dce5e1"/><text x="70" y="845" fill="#647780" font-size="22" font-weight="400">Sơ đồ chức năng minh họa; không phải bản vẽ thi công hoặc mặt bằng kho thực tế.</text></g></svg>