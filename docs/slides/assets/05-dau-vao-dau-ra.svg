<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Mô hình ESP32 trên Wokwi"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#4d8176"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="70" y="85" fill="#183e36" font-size="43" font-weight="700">Mô hình ESP32 trên Wokwi</text><text x="70" y="132" fill="#647780" font-size="24" font-weight="400">PlatformIO biên dịch firmware C++; Wokwi thực thi mô phỏng</text><rect x="70" y="220" width="470" height="415" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="95" y="264" fill="#146c5b" font-size="29" font-weight="650">Đầu vào</text><text x="95" y="311" fill="#263b42" font-size="24" font-weight="400">DHT22: nhiệt độ / độ ẩm</text><text x="95" y="349" fill="#263b42" font-size="24" font-weight="400">Contact: trạng thái cửa</text><text x="95" y="387" fill="#263b42" font-size="24" font-weight="400">Beam: rèm quang</text><text x="95" y="425" fill="#263b42" font-size="24" font-weight="400">Presence: có người</text><text x="95" y="463" fill="#263b42" font-size="24" font-weight="400">Panic: nút khẩn cấp</text><text x="95" y="501" fill="#263b42" font-size="24" font-weight="400">Serial: RFID IN / OUT</text><path d="M 545 420 L 590 420" stroke="#4d8176" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="600" y="300" width="400" height="260" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="625" y="344" fill="#146c5b" font-size="29" font-weight="650">ESP-C01</text><text x="625" y="391" fill="#263b42" font-size="24" font-weight="400">Quy tắc an toàn cục bộ</text><text x="625" y="429" fill="#263b42" font-size="24" font-weight="400">Đếm người và timer</text><text x="625" y="467" fill="#263b42" font-size="24" font-weight="400">MQTT/TLS + ACK</text><path d="M 1005 420 L 1050 420" stroke="#4d8176" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="1060" y="220" width="470" height="415" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="1085" y="264" fill="#146c5b" font-size="29" font-weight="650">Đầu ra</text><text x="1085" y="311" fill="#263b42" font-size="24" font-weight="400">Trạng thái hai cửa D07/D08</text><text x="1085" y="349" fill="#263b42" font-size="24" font-weight="400">Khóa / mô phỏng chuyển động</text><text x="1085" y="387" fill="#263b42" font-size="24" font-weight="400">LED: đèn, còi, sưởi, quạt</text><text x="1085" y="425" fill="#263b42" font-size="24" font-weight="400">Telemetry và sự kiện</text><text x="1085" y="463" fill="#263b42" font-size="24" font-weight="400">ACK: áp dụng / từ chối</text><path d="M70 800 H1530" stroke="#dce5e1"/><text x="70" y="845" fill="#647780" font-size="22" font-weight="400">Sơ đồ đầu vào/ra theo firmware; không phải ảnh chụp tab Wokwi Simulator.</text></g></svg>