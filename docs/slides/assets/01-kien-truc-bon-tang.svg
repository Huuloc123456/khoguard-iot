<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Kiến trúc IoT gồm bốn tầng"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#4d8176"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="70" y="85" fill="#183e36" font-size="43" font-weight="700">Kiến trúc IoT gồm bốn tầng</text><text x="70" y="132" fill="#647780" font-size="24" font-weight="400">Từ đầu vào tại kho đến giao diện của người vận hành</text><rect x="100" y="180" width="1400" height="110" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="125" y="224" fill="#146c5b" font-size="29" font-weight="650">1. Thu thập và chấp hành</text><text x="125" y="271" fill="#263b42" font-size="24" font-weight="400">Đọc cảm biến, RFID; điều khiển cửa và tín hiệu cảnh báo.</text><path d="M 800 292 L 800 320" stroke="#4d8176" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="100" y="325" width="1400" height="110" rx="18" fill="#f4f7f8" stroke="#cbdad5"/><text x="125" y="369" fill="#146c5b" font-size="29" font-weight="650">2. Mạng và truyền dẫn</text><text x="125" y="416" fill="#263b42" font-size="24" font-weight="400">Chuyển bản tin qua gateway; sử dụng MQTT/TLS trong mô hình.</text><path d="M 800 437 L 800 465" stroke="#4d8176" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="100" y="470" width="1400" height="110" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="125" y="514" fill="#146c5b" font-size="29" font-weight="650">3. Máy chủ và xử lý</text><text x="125" y="561" fill="#263b42" font-size="24" font-weight="400">Mosquitto → Backend Node.js → MySQL.</text><path d="M 800 582 L 800 610" stroke="#4d8176" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="100" y="615" width="1400" height="110" rx="18" fill="#f4f7f8" stroke="#cbdad5"/><text x="125" y="659" fill="#146c5b" font-size="29" font-weight="650">4. Ứng dụng</text><text x="125" y="706" fill="#263b42" font-size="24" font-weight="400">Dashboard React: giám sát, thao tác, lịch sử và báo cáo.</text><path d="M70 800 H1530" stroke="#dce5e1"/><text x="70" y="845" fill="#647780" font-size="22" font-weight="400">KhoGuard · Thiết kế phân tầng; phần cứng công nghiệp thuộc hướng triển khai thực tế.</text></g></svg>