<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Thiết bị tự kiểm tra trước khi đóng cửa"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#4d8176"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="70" y="85" fill="#183e36" font-size="43" font-weight="700">Thiết bị tự kiểm tra trước khi đóng cửa</text><text x="70" y="132" fill="#647780" font-size="24" font-weight="400">Các điều kiện phải đồng thời thỏa mãn</text><rect x="100" y="215" width="430" height="155" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="125" y="259" fill="#146c5b" font-size="29" font-weight="650">Số người</text><text x="125" y="306" fill="#263b42" font-size="24" font-weight="400">Đã xác minh và bằng 0</text><rect x="585" y="215" width="430" height="155" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="610" y="259" fill="#146c5b" font-size="29" font-weight="650">Hiện diện</text><text x="610" y="306" fill="#263b42" font-size="24" font-weight="400">Không còn phát hiện người</text><rect x="1070" y="215" width="430" height="155" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="1095" y="259" fill="#146c5b" font-size="29" font-weight="650">Rèm quang</text><text x="1095" y="306" fill="#263b42" font-size="24" font-weight="400">Không bị che chắn</text><path d="M 315 372 L 315 475" stroke="#4d8176" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M 800 372 L 800 475" stroke="#4d8176" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M 1285 372 L 1285 475" stroke="#4d8176" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="100" y="480" width="1400" height="130" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="125" y="524" fill="#146c5b" font-size="29" font-weight="650">Đầu vào rõ ràng · không panic · điều kiện liên động hợp lệ</text><text x="125" y="571" fill="#263b42" font-size="24" font-weight="400">Lệnh đúng phiên và revision; thiết bị có thể từ chối yêu cầu đóng.</text><path d="M 800 612 L 800 670" stroke="#4d8176" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="365" y="725" fill="#146c5b" font-size="27" font-weight="650">ĐỦ ĐIỀU KIỆN → ĐÓNG     |     CHƯA RÕ / NGUY HIỂM → TỪ CHỐI</text><path d="M70 800 H1530" stroke="#dce5e1"/><text x="70" y="845" fill="#647780" font-size="22" font-weight="400">Mô hình C++ trên ESP32; cơ cấu đóng/mở và cảm biến được mô phỏng.</text></g></svg>