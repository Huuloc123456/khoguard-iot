<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="MySQL lưu dữ liệu vận hành"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#4d8176"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="70" y="85" fill="#183e36" font-size="43" font-weight="700">MySQL lưu dữ liệu vận hành</text><text x="70" y="132" fill="#647780" font-size="24" font-weight="400">Các nhóm bảng chính trong schema khoguard_demo</text><rect x="70" y="200" width="470" height="220" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="95" y="244" fill="#146c5b" font-size="29" font-weight="650">Cấu trúc kho</text><text x="95" y="291" fill="#263b42" font-size="24" font-weight="400">warehouses · zones</text><text x="95" y="329" fill="#263b42" font-size="24" font-weight="400">devices · doors</text><rect x="565" y="200" width="470" height="220" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="590" y="244" fill="#146c5b" font-size="29" font-weight="650">Thiết bị và đo đạc</text><text x="590" y="291" fill="#263b42" font-size="24" font-weight="400">device_sessions · device_current</text><text x="590" y="329" fill="#263b42" font-size="24" font-weight="400">telemetry · device_events</text><rect x="1060" y="200" width="470" height="220" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="1085" y="244" fill="#146c5b" font-size="29" font-weight="650">Điều khiển / cảnh báo</text><text x="1085" y="291" fill="#263b42" font-size="24" font-weight="400">door_commands · alerts</text><text x="1085" y="329" fill="#263b42" font-size="24" font-weight="400">alert_acks</text><rect x="70" y="480" width="470" height="220" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="95" y="524" fill="#146c5b" font-size="29" font-weight="650">Người dùng</text><text x="95" y="571" fill="#263b42" font-size="24" font-weight="400">users · user_sessions</text><text x="95" y="609" fill="#263b42" font-size="24" font-weight="400">auth_audit</text><rect x="565" y="480" width="470" height="220" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="590" y="524" fill="#146c5b" font-size="29" font-weight="650">Ra vào</text><text x="590" y="571" fill="#263b42" font-size="24" font-weight="400">access_cards</text><text x="590" y="609" fill="#263b42" font-size="24" font-weight="400">access_audit</text><rect x="1060" y="480" width="470" height="220" rx="18" fill="#edf6f3" stroke="#cbdad5"/><text x="1085" y="524" fill="#146c5b" font-size="29" font-weight="650">Nhận hàng</text><text x="1085" y="571" fill="#263b42" font-size="24" font-weight="400">slots</text><text x="1085" y="609" fill="#263b42" font-size="24" font-weight="400">reservations</text><path d="M70 800 H1530" stroke="#dce5e1"/><text x="70" y="845" fill="#647780" font-size="22" font-weight="400">Sơ đồ nhóm chức năng; không biểu diễn đầy đủ khóa ngoại của từng bảng.</text></g></svg>